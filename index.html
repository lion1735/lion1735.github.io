<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 어른이들 운동회 포스터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@100;300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --movie-bg: #050505;
        }
        
        body {
            margin: 0;
            transition: background-color 0.5s ease;
            overflow-x: hidden;
            background-color: var(--movie-bg);
        }

        /* 공통 토글 버튼 스타일 */
        .toggle-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }
        
        .toggle-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .toggle-btn:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.3);
        }

        /* 신청하기 버튼 공통 스타일 */
        .apply-btn {
            display: inline-block;
            background: #22c55e;
            color: white;
            padding: 12px 32px;
            border-radius: 12px;
            font-weight: 900;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px 0 rgba(34, 197, 94, 0.39);
        }

        .apply-btn:hover {
            background: #16a34a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.23);
        }

        /* 영화 포스터 스타일 전용 */
        .movie-mode {
            background-color: var(--movie-bg);
        }
        
        .movie-poster {
            width: 100%;
            max-width: 500px;
            /* 세로 길이를 더 길게 하기 위해 비율 조정 (기존 2/3 -> 2/3.5) */
            aspect-ratio: 2 / 3.5; 
            background: 
                linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.9) 80%, #000 100%),
                url('214b2eee-db15-4d8e-88db-f691aca5283a.jpeg') center/cover;
            position: relative;
            color: white;
            box-shadow: 0 0 100px rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4rem 2rem 2rem;
            text-align: center;
            overflow: hidden;
            margin: 40px auto;
        }

        .movie-poster::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
        }

        .main-title-movie {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 3.8rem;
            line-height: 1;
            background: linear-gradient(to bottom, #fff 50%, #777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.2));
        }
